<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Siva ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="stars"></div>
    <div class="stars stars2"></div>

    <div class="particles"></div>

    <!-- Main screen -->

    <main class="scene">

        <div class="card">

            <div class="mini-heart">♥</div>

            <div class="to">
                A little something
                <span>from Padma</span>
            </div>

            <h1>
                For <span>Siva</span>
            </h1>

            <div class="line"></div>

            <p class="intro">
                Some things are better felt
                than said...
            </p>

            <button id="openBtn">
                <span class="gift">♡</span>
                Open My Heart
            </button>

            <p class="hint">
                Tap when you're ready ✨
            </p>

            <!-- Surprise -->

            <section id="surprise">

                <div class="heart-container">

                    <div class="heart">
                        ♥
                    </div>

                </div>

                <p class="small-title">
                    TO SIVA
                </p>

                <h2>
                    Dear Siva,
                </h2>

                <div id="message"></div>

                <div class="signature">
                    With love,
                    <strong>Padma</strong>
                </div>

                <div class="bottom-hearts">
                    ♥ &nbsp; ✦ &nbsp; ♥
                </div>

            </section>

        </div>

    </main>


    <!-- Music -->

    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</body>
</html>
