<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Surprise 💖</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, #ff9a9e 0%, transparent 30%),
                radial-gradient(circle at 80% 30%, #fad0c4 0%, transparent 30%),
                radial-gradient(circle at 50% 80%, #a18cd1 0%, transparent 35%),
                linear-gradient(135deg, #667eea, #764ba2);

            animation: backgroundMove 10s ease-in-out infinite alternate;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 100%;
            }
        }

        /* Floating glowing circles */

        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;

            background: rgba(255,255,255,0.08);
            filter: blur(5px);

            animation: floatGlow 8s ease-in-out infinite;
        }

        .glow:nth-child(1) {
            top: -100px;
            left: -100px;
        }

        .glow:nth-child(2) {
            bottom: -120px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes floatGlow {
            0%,100% {
                transform: translate(0,0) scale(1);
            }

            50% {
                transform: translate(50px,-30px) scale(1.2);
            }
        }

        /* Main card */

        .container {
            position: relative;
            z-index: 10;

            width: 90%;
            max-width: 650px;

            padding: 50px 35px;

            text-align: center;

            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.3);

            border-radius: 30px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.25),
                inset 0 0 30px rgba(255,255,255,0.08);

            animation: cardAppear 1.5s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .title {
            color: white;
            font-size: 42px;
            font-weight: 700;

            text-shadow:
                0 0 10px rgba(255,255,255,0.7),
                0 0 30px rgba(255,100,200,0.7);

            margin-bottom: 15px;

            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 10px white;
            }

            to {
                text-shadow:
                    0 0 20px #fff,
                    0 0 40px #ff69b4;
            }
        }

        .subtitle {
            color: white;
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 35px;
        }

        /* Surprise button */

        .surprise-btn {
            border: none;

            padding: 18px 45px;

            border-radius: 50px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            color: #fff;

            background: linear-gradient(
                135deg,
                #ff416c,
                #ff4b2b
            );

            box-shadow:
                0 10px 25px rgba(255,65,108,0.4);

            transition: 0.3s;

            animation: buttonPulse 2s infinite;
        }

        .surprise-btn:hover {
            transform: scale(1.08);

            box-shadow:
                0 15px 40px rgba(255,65,108,0.7);
        }

        @keyframes buttonPulse {
            0%,100% {
                box-shadow:
                    0 0 0 0 rgba(255,65,108,0.5);
            }

            50% {
                box-shadow:
                    0 0 0 15px rgba(255,65,108,0);
            }
        }

        /* Message */

        .message {
            display: none;

            margin-top: 30px;

            color: white;

            animation: messageReveal 2s ease forwards;
        }

        .message.show {
            display: block;
        }

        @keyframes messageReveal {

            0% {
                opacity: 0;
                transform: scale(0.5) translateY(40px);
            }

            60% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .message h2 {
            font-size: 34px;
            margin-bottom: 18px;
        }

        .message p {
            font-size: 20px;
            line-height: 1.7;
        }

        .heart {
            font-size: 50px;
            display: inline-block;

            animation: heartBeat 1.2s infinite;
        }

        @keyframes heartBeat {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        /* Floating hearts */

        .floating-heart {
            position: absolute;

            bottom: -50px;

            font-size: 30px;

            animation: floatUp linear infinite;

            opacity: 0.8;
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

        /* Confetti */

        .confetti {
            position: absolute;

            width: 10px;
            height: 10px;

            top: -20px;

            animation: fall linear forwards;
        }

        @keyframes fall {

            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);
            }
        }

        /* Mobile */

        @media(max-width:600px) {

            .container {
                padding: 40px 20px;
            }

            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 17px;
            }

            .message h2 {
                font-size: 27px;
            }

            .message p {
                font-size: 17px;
            }

            .surprise-btn {
                font-size: 18px;
                padding: 16px 35px;
            }
        }

    </style>
</head>

<body>

    <!-- Background glowing circles -->

    <div class="glow"></div>
    <div class="glow"></div>


    <!-- Main card -->

    <div class="container">

        <div class="heart">💖</div>

        <h1 class="title">
            A Special Surprise
        </h1>

        <p class="subtitle">
            Something special is waiting for you...
        </p>

        <button
            class="surprise-btn"
            onclick="showSurprise()">

            🎁 Open Your Surprise

        </button>


        <!-- Hidden message -->

        <div
            id="message"
            class="message">

            <h2>
                🎉 Surprise! 🎉
            </h2>

            <p>
                You are one of the most wonderful people
                in this world. 💖
            </p>

            <p>
                May your life always be filled with
                happiness, love, laughter and beautiful
                moments. ✨
            </p>

            <p>
                Keep smiling and keep shining! 🌟
            </p>

            <div style="margin-top:20px;font-size:28px;">
                ❤️ 🎂 🎈 ✨ 💐 ❤️
            </div>

        </div>

    </div>


    <!-- Music -->

    <audio id="music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>


    <script>

        function showSurprise() {

            /* Show message */

            const message =
                document.getElementById("message");

            message.classList.add("show");


            /* Start music */

            const music =
                document.getElementById("music");

            music.play().catch(function(error) {

                console.log(
                    "Music could not start:",
                    error
                );

            });


            /* Change button */

            const button =
                document.querySelector(".surprise-btn");

            button.innerHTML =
                "💖 Surprise Opened!";


            button.style.animation =
                "none";


            /* Create hearts */

            createHearts();


            /* Create confetti */

            createConfetti();

        }


        function createHearts() {

            const hearts = [
                "❤️",
                "💖",
                "💕",
                "💗",
                "💓",
                "💝"
            ];

            for(let i = 0; i < 25; i++) {

                const heart =
                    document.createElement("div");

                heart.className =
                    "floating-heart";

                heart.innerHTML =
                    hearts[
                        Math.floor(
                            Math.random() * hearts.length
                        )
                    ];

                heart.style.left =
                    Math.random() * 100 + "%";

                heart.style.animationDuration =
                    (4 + Math.random() * 5) + "s";

                heart.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(heart);


                setTimeout(() => {

                    heart.remove();

                }, 10000);

            }

        }


        function createConfetti() {

            for(let i = 0; i < 100; i++) {

                const confetti =
                    document.createElement("div");

                confetti.className =
                    "confetti";

                confetti.innerHTML =
                    Math.random() > 0.5
                    ? "✨"
                    : "🎉";

                confetti.style.left =
                    Math.random() * 100 + "%";

                confetti.style.fontSize =
                    (10 + Math.random() * 20) + "px";

                confetti.style.animationDuration =
                    (2 + Math.random() * 4) + "s";

                confetti.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(confetti);


                setTimeout(() => {

                    confetti.remove();

                }, 7000);

            }

        }

    </script>

</body>
</html>
