<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Siva ❤️</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- Background -->

    <div class="stars"></div>

    <div class="stars stars2"></div>

    <div class="particles"></div>


    <!-- Main -->

    <main class="scene">

        <div class="card">


            <!-- Top Heart -->

            <div class="mini-heart">
                ♥
            </div>


            <!-- From -->

            <div class="to">

                A little something

                <span>
                    from Padma
                </span>

            </div>


            <!-- Heading -->

            <h1>

                For
                <span>Siva</span>

            </h1>


            <!-- Divider -->

            <div class="line"></div>


            <!-- Intro -->

            <p class="intro">

                Some things are better felt
                than said...

            </p>


            <!-- Open Button -->

            <button
                id="openBtn"
                type="button"
            >

                <span class="gift">
                    ♡
                </span>

                Open My Heart

            </button>


            <!-- Hint -->

            <p class="hint">

                Tap when you're ready ✨

            </p>


            <!-- Surprise -->

            <section
                id="surprise"
            >


                <!-- Big Heart -->

                <div class="heart-container">

                    <div class="heart">
                        ♥
                    </div>

                </div>


                <!-- Small Title -->

                <p class="small-title">

                    TO SIVA

                </p>


                <!-- Greeting -->

                <h2>

                    Dear Siva,

                </h2>


                <!-- Automatic Message -->

                <div id="message"></div>


                <!-- Bottom Hearts -->

                <div class="bottom-hearts">

                    ♥ &nbsp; ✦ &nbsp; ♥

                </div>


            </section>


        </div>

    </main>


    <!-- Music -->

    <audio
        id="music"
        loop
    >

        <source
            src="music.mp3"
            type="audio/mpeg"
        >

    </audio>


    <!-- JavaScript -->

    <script
        src="script.js"
    ></script>


</body>

</html>
